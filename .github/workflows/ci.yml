name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # The suite uses Testcontainers, which needs a working Docker daemon.
      # ubuntu-latest ships one; this fails fast and legibly if that changes.
      - name: Check Docker
        run: docker info > /dev/null

      # `clean` is not optional. Stale classes from a previous layout break
      # surefire's test discovery with an error that names nothing useful.
      - name: Test
        working-directory: backend
        run: mvn --batch-mode clean test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      # Also the check that this project builds without the commercial overlay:
      # @enterprise resolves to the stub unless FACTION_ENTERPRISE_UI says otherwise,
      # and nothing here sets it.
      - name: Build
        working-directory: frontend
        run: npm run build

  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every commit is signed off
        run: |
          missing=$(git log --no-merges --format='%H %s' \
            "origin/${{ github.base_ref }}..HEAD" | while read -r sha subject; do
              git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>' \
                || echo "  $sha $subject"
            done)
          if [ -n "$missing" ]; then
            echo "These commits are missing a Signed-off-by line:"
            echo "$missing"
            echo
            echo "Add one with: git commit -s --amend   (or git rebase --signoff)"
            exit 1
          fi
          echo "All commits signed off."

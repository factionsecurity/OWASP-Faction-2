version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: client-portal-timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: clientportal
    volumes:
      - tsdb_data:/var/lib/postgresql/data
    networks:
      - client-portal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: client-portal-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - client-portal-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Optional: local PII detection for AI anonymization (no data leaves this host).
  # Enable + point the AI Anonymization config at http://localhost:5002.
  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    container_name: client-portal-presidio-analyzer
    ports:
      - "5002:3000"
    networks:
      - client-portal-network
    restart: unless-stopped

volumes:
  tsdb_data:
    driver: local
  minio_data:
    driver: local

networks:
  client-portal-network:
    driver: bridge

# Preserve the scheme the *browser* used, which is not the scheme nginx sees.
#
# In production TLS terminates at Cloudflare and the tunnel forwards plain HTTP
# to this container, so `$scheme` here is always "http". Overwriting
# X-Forwarded-Proto with it would tell the backend the connection was insecure
# and the media access cookie would be issued without the Secure flag. Honour
# the value the edge set, falling back to $scheme for direct connections (local
# development, or a future setup that terminates TLS here).
#
# Trusting a request header is only safe because nothing but the tunnel can
# reach this server — no ports are published to the host. If that ever changes,
# this must become an allowlist of trusted proxy addresses.
map $http_x_forwarded_proto $forwarded_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Allow large file uploads. Keep in step with the backend's
    # storage.max-upload-bytes (STORAGE_MAX_UPLOAD_BYTES), or oversized uploads
    # get nginx's HTML error page instead of the application's JSON one.
    client_max_body_size 500m;

    # Object storage is deliberately NOT proxied here.
    #
    # The browser never talks to MinIO: file uploads and downloads, inline
    # images and profile images are all streamed through authenticated backend
    # endpoints so that per-request permission checks apply and access can be
    # revoked immediately. MinIO should therefore be reachable only from the
    # backend on the internal network — it needs no route in this file, and
    # adding one would reintroduce the exposure this design removes.

    # API proxy
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The backend derives the media cookie's Secure flag from this. See the
        # $forwarded_scheme map above for why it is not just $scheme.
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_cache_bypass $http_upgrade;

        # File bodies now flow through the backend rather than straight to
        # object storage. Without these, nginx spools a whole 500 MB upload to
        # disk before forwarding a byte, and holds downloads in its own buffers.
        proxy_request_buffering off;
        proxy_buffering off;

        # Large transfers over slow links outlast the 60s defaults.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Swagger UI and its OpenAPI spec are served by the backend.
    #
    # `^~` is load-bearing on both. Swagger UI's own assets are .js/.css/.png,
    # and the static-asset regex location at the bottom of this file outranks a
    # plain prefix match — so without `^~` every one of them is looked up in the
    # SPA's document root, 404s, and the page renders as a blank shell that
    # never finishes loading.
    location ^~ /swagger-ui/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    }

    # The entry point springdoc advertises (springdoc.swagger-ui.path). It only
    # redirects to /swagger-ui/index.html, but it has to reach the backend to do
    # that — otherwise it falls through to the SPA catch-all and returns the
    # React app to anyone who follows the documented URL.
    location = /swagger-ui.html {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    }

    location ^~ /v3/api-docs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    }

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'self' blob:; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://api.dicebear.com; font-src 'self' data:; connect-src 'self'" always;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
